name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.release_tag.outputs.tag_name }}
      app_version: ${{ steps.release_tag.outputs.app_version }}
      tauri_config: ${{ steps.release_tag.outputs.tauri_config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install release script dependencies
        run: bun install --frozen-lockfile

      - name: Resolve tag name
        id: release_tag
        run: bun run release:version

      - name: Ensure tag is on main
        shell: bash
        run: |
          # 只允许 main 历史上的 v* tag 发布，避免临时分支误触发 Release。
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  quality-gate:
    name: Release quality gate
    needs: verify-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        shell: bash
        run: |
          # Release 前同时验证前端产物和 Tauri Rust 层。
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend
        run: bun run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  build-tauri:
    name: Build ${{ matrix.platform.name }}
    needs: [verify-tag, quality-gate]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-15
            args: ""
          - name: Linux
            runner: ubuntu-22.04
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.platform.name == 'Linux'
        shell: bash
        run: |
          # Tauri Linux 打包依赖 WebKitGTK、AppIndicator 和基础构建工具。
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # 缓存 Bun 下载包，node_modules 仍由 lockfile 重新展开，避免跨平台产物污染。
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # 缓存 Cargo registry/git 与 Tauri release target，显著减少重复 tag 构建时间。
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.verify-tag.outputs.tag_name }}
          releaseName: Encode Lab ${{ needs.verify-tag.outputs.tag_name }}
          releaseBody: |
            Download the installer for your platform from the assets below.

            Encode Lab is beta software. Keep your source media until you have verified the output.
          releaseDraft: false
          # updater 使用 GitHub latest 端点；beta 也必须作为普通 Release 才能被 latest.json 发现。
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          tauriScript: bun run tauri
          args: ${{ matrix.platform.args }} --config '${{ needs.verify-tag.outputs.tauri_config }}'

  verify-updater-release:
    name: Verify updater release assets
    needs: [verify-tag, build-tauri]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Stop when build failed
        if: needs.build-tauri.result != 'success'
        run: |
          # 构建失败时不能继续检查，避免把半成品误判为可更新版本。
          echo "build-tauri result: ${{ needs.build-tauri.result }}"
          exit 1

      - name: Verify updater manifest and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify-tag.outputs.tag_name }}
          APP_VERSION: ${{ needs.verify-tag.outputs.app_version }}
        shell: bash
        run: |
          # latest.json 是客户端固定访问的更新清单，缺失会导致更新检测直接失败。
          asset_names="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$asset_names"

          if ! grep -Fxq "latest.json" <<< "$asset_names"; then
            echo "::error::Release $TAG_NAME is missing latest.json for Tauri updater"
            exit 1
          fi

          # .sig 是 latest.json 中 signature 字段的来源，缺失说明安装包没有可校验签名。
          signature_count="$(grep -Ec '\.sig$' <<< "$asset_names" || true)"
          if [[ "$signature_count" -eq 0 ]]; then
            echo "::error::Release $TAG_NAME is missing updater signature assets"
            exit 1
          fi

          # updater 客户端不会携带 GitHub 登录态，必须验证公开端点能匿名返回 JSON。
          curl -LfsS "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" >/tmp/latest.json
          jq -e --arg version "$APP_VERSION" --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG_NAME" '
            .version == $version
            and (.platforms | type == "object")
            and (.platforms | length > 0)
            and ([.platforms[] | (.signature | type == "string" and length > 0)] | all)
            and ([.platforms[] | (.url | startswith("https://github.com/" + $repo + "/releases/download/" + $tag + "/"))] | all)
          ' /tmp/latest.json >/dev/null

          failed=0
          while read -r url; do
            # 清单中的安装包 URL 也必须匿名可访问，否则客户端拿到清单后仍会安装失败。
            if ! curl --retry 5 --retry-delay 10 --retry-all-errors -LfsS --head "$url" >/dev/null; then
              echo "::error::Updater asset URL is not anonymously accessible: $url"
              failed=1
            fi
          done < <(jq -r '.platforms[].url' /tmp/latest.json | sort -u)

          if [[ "$failed" -ne 0 ]]; then
            exit "$failed"
          fi

          # 为人工下载提供独立校验清单；updater 自身仍以 Tauri 签名作为信任边界。
          checksum_dir="$(mktemp -d)"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$checksum_dir"
          (
            cd "$checksum_dir"
            find . -maxdepth 1 -type f ! -name "SHA256SUMS" -printf "%P\0" \
              | sort -z \
              | xargs -0 sha256sum >SHA256SUMS
          )
          gh release upload "$TAG_NAME" "$checksum_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
